# <target-repo>/.github/workflows/security.yml
name: security
on:
  schedule:
    - cron: '23 3 * * 1'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  npm-audit:
    uses: gr1m0h/.github/.github/workflows/npm-audit.yml@3339cb3918ec1c174852189752e314ee67cb414f
    # Node toolchains (e.g. Docusaurus) pull deep build-time dependency
    # trees where high-severity advisories with no upstream fix are common
    # and not reachable in the shipped output. Gate on `critical` so the
    # security check stays actionable instead of perpetually red.
    with:
      audit-level: critical
  osv-scan:
    uses: gr1m0h/.github/.github/workflows/osv-scanner.yml@3339cb3918ec1c174852189752e314ee67cb414f
    permissions:
      contents: read
      security-events: write
  gitleaks:
    uses: gr1m0h/.github/.github/workflows/gitleaks.yml@3339cb3918ec1c174852189752e314ee67cb414f
    permissions:
      contents: read
      pull-requests: read
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    uses: gr1m0h/.github/.github/workflows/dependency-review.yml@3339cb3918ec1c174852189752e314ee67cb414f
    permissions:
      contents: read
      pull-requests: read
  codeql:
    uses: gr1m0h/.github/.github/workflows/codeql-typescript.yml@3339cb3918ec1c174852189752e314ee67cb414f
    permissions:
      contents: read
      security-events: write
      actions: read
  actionlint:
    uses: gr1m0h/.github/.github/workflows/actions-pin-lint.yml@3339cb3918ec1c174852189752e314ee67cb414f
